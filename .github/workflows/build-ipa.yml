name: Build ModManager IPA

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project ModManager.xcodeproj \
            -scheme ModManager \
            -configuration Release \
            -archivePath build/ModManager.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ModManager.xcarchive/Products/Applications/ModManager.app build/Payload/
          cd build
          zip -r ModManager.ipa Payload
          ls -lh ModManager.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModManager-Unsigned-IPA
          path: build/ModManager.ipa
          retention-days: 14

      - name: Release IPA on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ModManager.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
